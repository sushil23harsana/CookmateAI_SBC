# Render blueprint: deploys the Cookmate engine API from this repo's Dockerfile.
# In the Render dashboard: New + -> Blueprint -> pick this repo -> set the two
# secret env vars when prompted. Free tier is fine for the demo.
services:
  - type: web
    name: cookmate-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKMATE_LLM
        value: openai # primary brain; the other provider's key (if set) is the fallback
      - key: OPENAI_API_KEY
        sync: false # paste in the dashboard — never in the repo
      - key: ANTHROPIC_API_KEY
        sync: false # paste in the dashboard — never in the repo
      - key: CORS_ORIGIN
        sync: false # your Vercel URL, e.g. https://cookmate.vercel.app
      - key: TRUST_PROXY
        value: 'true' # Render fronts the service with a proxy
      - key: COOKMATE_PROVIDER
        value: mock # flip to swiggy once users should shop the real catalog
      - key: SWIGGY_CLIENT_ID
        sync: false # OAuth client id issued by Swiggy's gateway (DCR logs it)
      - key: DATABASE_URL
        sync: false # optional Neon Postgres — durable per-user Swiggy connections
